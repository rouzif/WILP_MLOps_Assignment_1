apiVersion: v1
kind: Service
metadata:
  name: heart-disease-api-service
  namespace: heart-disease-mlops
  labels:
    app: heart-disease-api
    tier: api
spec:
  type: LoadBalancer
  selector:
    app: heart-disease-api
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000