
data:
  load_from_saved_file: False
  save_loaded_data: True
  input_data_path: 'data/input_data.csv'
  column_category_path: 'data/column_category.json'
  visualisation_directory: 'data/visualisation/'
  missing_imputation_path: 'data/missing_imputation.json'
  missing_imputed_data_path: 'data/missing_imputed_data.csv'
  column_category_encoded_path: 'data/column_category_encoded.json'
  encoded_data_path: 'data/encoded_data.csv'
  scaling_params_path: 'data/scaling_params.json'
  column_category_scaled_path: 'data/column_category_scaled.json'
  scaled_data_path: 'data/scaled_data.csv'
  encoding_scheme_path: 'data/encoding_scheme.json'
  train_data_path: 'data/train_data.csv'
  test_data_path: 'data/test_data.csv'
  preprocessor_path: 'data/preprocessor.joblib'
  predicted_path_prefix: 'data/predicted_'

variables:
  target: 'heart_disease_flag'

partition:
  test_ratio: 0.3

model:
  algo: 'rf'  # Choose from 'rf' - For Random Forest, 'xgb' - For XGBoost
  custom_feature_fit: False
  custom_feature_list: ['age']
  model_path: 'model/model.joblib'
  eval_path_prefix: 'model/eval_'
  training_plots_path: 'model/training_plots/'
  champion_directory: 'model/champion/'

ml_flow:
  experiment: 'mlops-heart-disease-pred'
  tracking_uri: 'sqlite:///data/mlflow.db'
