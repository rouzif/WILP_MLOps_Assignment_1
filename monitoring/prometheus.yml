global:
  scrape_interval: 5s     # How frequently to scrape targets (5s for testing/demo)
  evaluation_interval: 5s # How frequently to evaluate alert rules

scrape_configs:
  - job_name: "heart-disease-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          environment: "production"
          service: "heart-disease-prediction-api"